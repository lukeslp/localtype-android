android.useAndroidX=true
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
kotlin.code.style=official

# Keep resource file names in release builds: F-Droid finds the launcher icon PNGs by name (res/mipmap-*/ic_launcher.png).
android.enableResourceOptimizations=false

# modelkit compiles against the same API level as the app (its own default is 35).
modelkit.compileSdk=36
# Android Gradle Plugin 8.8.2 was tested up to API 35; it builds against 36 and says so on every run without this.
android.suppressUnsupportedCompileSdk=36
